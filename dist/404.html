<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback.
      // Redirects /opdemonstraions/some/route -> /opdemonstraions/?/some/route
      // Inspired by https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location
        var pathSegmentsToKeep = 1 // keep "/opdemonstraions"

        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        )
      })()
    </script>
  </head>
  <body></body>
</html>
